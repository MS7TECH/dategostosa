<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff1493">
<title>Convite Barbie 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-primary: #ff1493;
    --pink-light: #ff69b4;
    --pink-soft: #ffeaf5;
    --text-dark: #4a0328;
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-dark);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--safe-top) + 48px) 16px calc(var(--safe-bottom) + 16px);
    background: radial-gradient(circle at 50% 18%, #ffeef7 0%, #ffd4ed 50%, #ffbfe4 100%);
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(var(--pink-light) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.22;
    pointer-events: none;
    z-index: 0;
  }

  /* Cartão Central */
  .card {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 360px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 3px solid rgba(255, 105, 180, 0.5);
    border-radius: 34px;
    padding: 72px 20px 28px;
    box-shadow: 0 16px 36px rgba(255, 20, 147, 0.24), 0 0 24px rgba(255, 105, 180, 0.28);
    text-align: center;
  }

  /* Moldura da Foto */
  .photo-wrapper {
    position: absolute;
    left: 50%;
    top: -76px;
    transform: translateX(-50%);
    width: 130px;
    height: 130px;
    z-index: 4;
  }

  .photo-badge {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #ffffff, #ff69b4, #ff1493);
    box-shadow: 0 10px 24px rgba(255, 20, 147, 0.4), 0 0 16px rgba(255, 105, 180, 0.35);
    animation: float 2.8s ease-in-out infinite;
    position: relative;
  }

  .photo-crop {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #ffffff;
    background: #ffd6ec;
  }

  .user-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(2.2);
    transform-origin: 52% 24%;
  }

  .bubble {
    position: absolute;
    right: -14px;
    top: 2px;
    background: #ffffff;
    border: 3px solid var(--pink-primary);
    border-radius: 18px;
    padding: 4px 10px;
    font-size: 1.45rem;
    box-shadow: 0 4px 12px rgba(255, 20, 147, 0.25);
    animation: wiggle 2.4s ease-in-out infinite;
  }

  .bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 10px;
    border-width: 6px 6px 0 0;
    border-style: solid;
    border-color: var(--pink-primary) transparent transparent transparent;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(8deg); }
    50% { transform: rotate(-6deg) scale(1.06); }
  }

  .logo {
    font-family: 'Pacifico', cursive;
    font-size: 1.9rem;
    color: var(--pink-primary);
    margin-bottom: 4px;
    text-shadow: 0 2px 6px rgba(255, 20, 147, 0.18);
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text-dark);
    margin: 12px 0 22px;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    min-height: 60px;
    position: relative;
  }

  button, .btn-link {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    cursor: pointer;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, font-size 0.2s;
  }

  button:active, .btn-link:active {
    transform: scale(0.95);
  }

  .yes {
    background: linear-gradient(135deg, #ff409f, #ff1493);
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(255, 20, 147, 0.4);
    flex: 1;
    z-index: 2;
  }

  .no {
    background: var(--pink-soft);
    color: var(--pink-primary);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    flex: 1;
    line-height: 1.2;
    z-index: 1;
  }

  /* Efeito de tremor forte ao clicar no Não */
  .shake {
    animation: shakeAnim 0.35s ease-in-out !important;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0) scale(var(--no-scale, 1)); }
    20% { transform: translateX(-8px) rotate(-4deg) scale(var(--no-scale, 1)); }
    40% { transform: translateX(8px) rotate(4deg) scale(var(--no-scale, 1)); }
    60% { transform: translateX(-6px) scale(var(--no-scale, 1)); }
    80% { transform: translateX(6px) scale(var(--no-scale, 1)); }
  }

  .big-confirm {
    background: linear-gradient(135deg, #25d366, #128c7e);
    color: #ffffff;
    font-size: 1.2rem;
    padding: 16px 28px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4);
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  .step {
    display: none;
    opacity: 0;
  }

  .step.on {
    display: block;
    animation: fadeIn 0.35s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bg-heart {
    position: fixed;
    bottom: -50px;
    z-index: 1;
    pointer-events: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    to { transform: translateY(-115vh) rotate(35deg); opacity: 0; }
  }

  .burst {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    animation: burstAnim 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  @keyframes burstAnim {
    to {
      transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(var(--rot));
      opacity: 0;
    }
  }
</style>
</head>
<body>

<main class="card">
  <div class="photo-wrapper" aria-hidden="true">
    <div class="photo-badge">
      <div class="photo-crop">
        <img src="gostosa.png" alt="Barbie" class="user-photo">
      </div>
      <div class="bubble" id="bubble">👠</div>
    </div>
  </div>

  <div class="logo">Barbie Date 💖</div>

  <section class="step on" id="s1" data-e="👠">
    <h1>Ei, gata... quer sair cmg?</h1>
    <div class="btns">
      <button class="yes" data-next="s2">Sim 💖</button>
      <button class="no">Não</button>
    </div>
  </section>

  <section class="step" id="s2" data-e="🍤">
    <h1>Quer bagaçar um acarajé de 1kg?</h1>
    <div class="btns">
      <button class="yes" data-next="s3">Quero! 😋</button>
      <button class="no">Não</button>
    </div>
  </section>

  <section class="step" id="s3" data-e="🥄">
    <h1>E depois dormir de conchinha?</h1>
    <div class="btns">
      <button class="yes" data-next="s4">Claro 🥰</button>
      <button class="no">Não</button>
    </div>
  </section>

  <section class="step" id="s4" data-e="🎀">
    <h1>Então tá combinado Minha Gostosa</h1>
    <div class="btns">
      <a class="btn-link big-confirm" id="confirm" target="_blank" rel="noopener" 
         href="https://wa.me/5571982003280?text=confirmo%20messias%20gost%C3%A3o%20da%20bahia">
        Confirmar no Zap 💌
      </a>
    </div>
  </section>
</main>

<script>
  const bubble = document.getElementById('bubble');
  const hearts = ['💖', '💗', '💕', '💘', '🎀', '🌸'];

  // Falas e emojis da brincadeira de clicar com mais força
  const forceSteps = [
    { text: "Clica com mais força! 😂", emoji: "🧐" },
    { text: "Tá fraco! Bota força! 💪", emoji: "😂" },
    { text: "Quase foi... aperta mais! 🔨", emoji: "👀" },
    { text: "O botão tá emperrado kkk", emoji: "😜" },
    { text: "Erro: Força insuficiente ⚠️", emoji: "🤖" },
    { text: "Cansei! Aceita logo 💖", emoji: "🥰" }
  ];

  let forceCount = 0;

  // Corações no fundo
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('span');
    el.className = 'bg-heart';
    el.textContent = hearts[i % hearts.length];
    el.style.left = Math.random() * 92 + 'vw';
    el.style.fontSize = 16 + Math.random() * 20 + 'px';
    el.style.animationDuration = 6 + Math.random() * 7 + 's';
    el.style.animationDelay = -Math.random() * 8 + 's';
    document.body.appendChild(el);
  }

  // Lógica da zoação ao clicar no "Não"
  document.querySelectorAll('.no').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();

      const currentStep = btn.closest('.step');
      const yesBtn = currentStep.querySelector('.yes');

      // Vibração no celular
      if (navigator.vibrate) navigator.vibrate([30, 40, 50]);

      // Animação de tremor
      btn.classList.remove('shake');
      void btn.offsetWidth; // força reflow
      btn.classList.add('shake');

      // Se ainda não atingiu o limite, avança a zoeira e cresce o Sim
      if (forceCount < forceSteps.length - 1) {
        const stepData = forceSteps[forceCount];
        btn.textContent = stepData.text;
        bubble.textContent = stepData.emoji;

        // O botão Sim vai ficando gigante e chamativo
        const yesScale = 1 + (forceCount + 1) * 0.12;
        yesBtn.style.transform = `scale(${yesScale})`;
        yesBtn.style.boxShadow = `0 10px 25px rgba(255, 20, 147, ${0.4 + forceCount * 0.1})`;

        // O botão Não vai diminuindo aos poucos
        const noScale = Math.max(0.75, 1 - (forceCount + 1) * 0.05);
        btn.style.setProperty('--no-scale', noScale);
        btn.style.transform = `scale(${noScale})`;

        forceCount++;
      } else {
        // Cansou! Transforma o Não em Sim e avança
        btn.textContent = "Aceitou! 🥰";
        bubble.textContent = "💖";
        triggerBurst(window.innerWidth / 2, window.innerHeight / 2, 40);

        setTimeout(() => {
          // Dispara o clique do Sim automaticamente
          yesBtn.click();
          // Reseta a zoeira para a próxima etapa
          forceCount = 0;
          btn.textContent = "Não";
          btn.style.transform = "scale(1)";
          btn.style.removeProperty('--no-scale');
          yesBtn.style.transform = "scale(1)";
        }, 500);
      }
    });
  });

  // Efeito de explosão de corações
  function triggerBurst(x, y, count = 20) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.className = 'burst';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 100;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      const rot = (Math.random() - 0.5) * 120;

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.fontSize = 18 + Math.random() * 16 + 'px';
      el.style.setProperty('--tx', `${tx}px`);
      el.style.setProperty('--ty', `${ty}px`);
      el.style.setProperty('--rot', `${rot}deg`);

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
  }

  // Próximas etapas ao clicar no Sim
  document.querySelectorAll('[data-next]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const rect = btn.getBoundingClientRect();
      triggerBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);

      const currentStep = document.querySelector('.step.on');
      const nextStep = document.getElementById(btn.dataset.next);

      if (currentStep && nextStep) {
        currentStep.classList.remove('on');
        nextStep.classList.add('on');
        bubble.textContent = nextStep.dataset.e || '💖';
      }
    });
  });

  // Confirmação final no Zap
  const confirmBtn = document.getElementById('confirm');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', () => {
      triggerBurst(window.innerWidth / 2, window.innerHeight / 2, 40);
    });
  }
</script>
</body>
</html>
